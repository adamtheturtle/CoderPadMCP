name: Documentation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docc:
    name: Build DocC
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_27.app
      - name: Build documentation
        run: |
          swift package generate-documentation --target CoderPadMCP
          swift package generate-documentation --target CoderPadToolCore
