name: Release

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Validate tag and source version
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must be a semantic version such as 1.2.3 or v1.2.3."
            exit 1
          fi
          if ! grep -Fq "public let coderPadMCPVersion = \"$version\"" \
            Sources/CoderPadMCP/ReleaseVersion.swift; then
            echo "::error::coderPadMCPVersion does not match tag $RELEASE_TAG."
            exit 1
          fi
      - name: Test
        run: swift test

  macos:
    name: macOS universal
    needs: validate
    runs-on: macos-26
    env:
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY: ${{ secrets.ASC_KEY }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      DEVELOPER_ID_APP_CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_APP_CERT_P12_BASE64 }}
      DEVELOPER_ID_APP_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_APP_CERT_PASSWORD }}
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.5.app
      - name: Check signing configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for name in \
            ASC_ISSUER_ID \
            ASC_KEY \
            ASC_KEY_ID \
            DEVELOPER_ID_APP_CERT_P12_BASE64 \
            DEVELOPER_ID_APP_CERT_PASSWORD
          do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing release secrets: ${missing[*]}"
            exit 1
          fi
      - name: Build universal executable
        shell: bash
        run: |
          set -euo pipefail
          swift build -c release --arch arm64 --scratch-path .build-arm64
          swift build -c release --arch x86_64 --scratch-path .build-x86_64
          arm_bin="$(swift build -c release --arch arm64 \
            --scratch-path .build-arm64 --show-bin-path)/coderpad-mcp"
          x86_bin="$(swift build -c release --arch x86_64 \
            --scratch-path .build-x86_64 --show-bin-path)/coderpad-mcp"
          mkdir -p dist
          lipo -create "$arm_bin" "$x86_bin" -output dist/coderpad-mcp
          lipo -archs dist/coderpad-mcp
      - name: Sign, notarize, and package
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          package_name="coderpad-mcp-${version}-macos-universal"
          package_dir="$RUNNER_TEMP/$package_name"
          archive_path="$GITHUB_WORKSPACE/dist/$package_name.zip"
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          asc_key_path="$RUNNER_TEMP/asc-api-key.p8"
          keychain_path="$RUNNER_TEMP/release-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"

          cleanup() {
            security delete-keychain "$keychain_path" >/dev/null 2>&1 || true
            rm -f "$certificate_path" "$asc_key_path"
          }
          trap cleanup EXIT

          (
            umask 077
            printf '%s' "$DEVELOPER_ID_APP_CERT_P12_BASE64" \
              | base64 --decode > "$certificate_path"
            printf '%s' "$ASC_KEY" | base64 --decode > "$asc_key_path"
          )
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security import "$certificate_path" \
            -P "$DEVELOPER_ID_APP_CERT_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          signing_identity="$(
            security find-identity -v -p codesigning "$keychain_path" \
              | grep 'Developer ID Application' \
              | head -1 \
              | sed -E 's/.*"(.*)".*/\1/'
          )"
          if [[ -z "$signing_identity" ]]; then
            echo "::error::No Developer ID Application identity found in certificate."
            exit 1
          fi

          codesign \
            --force \
            --options runtime \
            --timestamp \
            --sign "$signing_identity" \
            --keychain "$keychain_path" \
            dist/coderpad-mcp
          codesign --verify --strict --verbose=2 dist/coderpad-mcp

          mkdir -p "$package_dir"
          cp dist/coderpad-mcp LICENSE README.md "$package_dir/"
          ditto -c -k --sequesterRsrc --keepParent "$package_dir" "$archive_path"
          set +e
          submit_output="$(
            xcrun notarytool submit "$archive_path" \
              --key "$asc_key_path" \
              --key-id "$ASC_KEY_ID" \
              --issuer "$ASC_ISSUER_ID" \
              --wait 2>&1
          )"
          submit_rc=$?
          set -e
          printf '%s\n' "$submit_output"
          submission_id="$(
            printf '%s\n' "$submit_output" \
              | awk '/^[[:space:]]*id:/ { print $2; exit }'
          )"
          if ! printf '%s\n' "$submit_output" | grep -q 'status: Accepted'; then
            if [[ -n "$submission_id" ]]; then
              xcrun notarytool log "$submission_id" \
                --key "$asc_key_path" \
                --key-id "$ASC_KEY_ID" \
                --issuer "$ASC_ISSUER_ID" || true
            fi
            echo "::error::Notarization failed (exit $submit_rc; status not Accepted)."
            exit 1
          fi
          (
            cd dist
            shasum -a 256 "$package_name.zip" > "$package_name.zip.sha256"
          )
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-release
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  linux:
    name: Linux x86_64
    needs: validate
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Build and package
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          package_name="coderpad-mcp-${version}-linux-x86_64"
          package_dir="$RUNNER_TEMP/$package_name"
          mkdir -p "$package_dir" dist
          swift build -c release --static-swift-stdlib
          binary="$(swift build -c release --static-swift-stdlib --show-bin-path)/coderpad-mcp"
          cp "$binary" LICENSE README.md "$package_dir/"
          tar -C "$RUNNER_TEMP" -czf "dist/$package_name.tar.gz" "$package_name"
          (
            cd dist
            sha256sum "$package_name.tar.gz" > "$package_name.tar.gz.sha256"
          )
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-release
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [macos, linux]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Publish assets
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "CoderPadMCP $RELEASE_TAG"
          fi
